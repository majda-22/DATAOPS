name: dataops-detective
services:
  postgres-test:
    image: postgres:17.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dataops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dataops_local_test}
      POSTGRES_DB: ${POSTGRES_DB:-dataops_metadata_test}
    ports:
      - "127.0.0.1:${TEST_POSTGRES_PORT:-55433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - postgres-test:/var/lib/postgresql/data
volumes:
  postgres-test:
