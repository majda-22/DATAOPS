dataset: olist_order_payments
version: 1
description: Raw Olist order_payments. Preserve source spellings and optional fields;
  no business cleaning is applied.
layer: bronze
format: csv
columns:
- name: order_id
  logical_type: string
  nullable: false
- name: payment_sequential
  logical_type: integer
  nullable: false
- name: payment_type
  logical_type: string
  nullable: false
- name: payment_installments
  logical_type: integer
  nullable: false
- name: payment_value
  logical_type: float
  nullable: false
primary_key:
- order_id
- payment_sequential
quality_rules:
- id: olist_order_payments_minimum_rows
  type: min_row_count
  min_rows: 1
foreign_keys:
- id: olist_order_payments_order_id_fk
  columns:
  - order_id
  reference_dataset: olist_orders
  reference_columns:
  - order_id
