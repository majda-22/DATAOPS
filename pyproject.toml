[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataops-detective"
version = "0.1.0"
description = "A data observability and root-cause diagnosis platform"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.10,<3",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
db = [
    "SQLAlchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.1,<4.0",
    "python-dotenv==1.2.4"
]
storage = [
    "boto3==1.43.75",
]
spark = [
    "pyspark==4.2.0",
    "delta-spark==4.4.1",
]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "pre-commit",
    "types-PyYAML",
]

[tool.setuptools.packages.find]
include = ["dataops*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["dataops"]
check_untyped_defs = true
warn_unused_ignores = true



